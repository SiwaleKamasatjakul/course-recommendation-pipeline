name: dbt CI

on:
  pull_request:
    paths:
      - 'dbt_clickstream/**'
      - '.github/workflows/dbt-*.yml'
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dbt_clickstream
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_clickstream/ci
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_DBT_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_DBT_PRIVATE_KEY }}
      DBT_SCHEMA: PR_${{ github.event.pull_request.number }}

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt
        run: pip install "dbt-core~=1.10.0" "dbt-snowflake~=1.10.0"

      - name: Install dbt packages
        run: dbt deps

      - name: Build and test (PR schemas)
        run: dbt build --target ci

      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = "target/run_results.json"
          if not os.path.exists(path):
              print("No run_results.json (build did not start)")
              raise SystemExit
          r = json.load(open(path))
          res = r["results"]
          models = [x for x in res if x["unique_id"].startswith("model.")]
          tests  = [x for x in res if x["unique_id"].startswith("test.")]
          ok = lambda xs: sum(x["status"] in ("success", "pass") for x in xs)
          print("### dbt CI result\n")
          print(f"- Total time: {r['elapsed_time']:.1f} s")
          print(f"- Models: {ok(models)}/{len(models)} succeeded")
          print(f"- Tests: {ok(tests)}/{len(tests)} passed")
          EOF

      - name: Drop PR schemas
        if: always()
        run: |
          dbt run-operation drop_ci_schemas --args "{prefix: $DBT_SCHEMA}" --target ci